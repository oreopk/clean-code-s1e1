<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet" 
      type="text/css"
    >
    <link 
      rel="stylesheet" 
      href="style.css" 
      media="screen" 
      charset="utf-8"
    >
  </head>
  <body class="page">
    <div class="header">
      <img class="header-image" src="./eisenhower-matrix.jpg">
      <a 
        class="more-info" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </div>
    <div class="main-container">
      <p id="add-label">
        <label for="new-task" class="label-add-item">Add Item</label>
        <div class="task-row-wrapper">
          <input id="new-task"class="input-text task" type="text">
          <button class="btn">Add</button>
        </div>
      </p>
      <h3 class="todo-title">Todo</h3>
      <ul id="todo-list">
        <li class="task-item">
          <input type="checkbox" class="task-checkbox">
          <label class="task task-label">Pay Bills</label>
          <input type="text" class="input-text task">
          <button class="btn edit-btn">Edit</button>
          <button class="btn delete-btn">
            <img src="./remove.svg" class="delete-icon">
          </button>
        </li>
        <li class="task-item edit-mode">
          <input type="checkbox" class="task-checkbox">
          <label class="task task-label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="input-text task">
          <button class="btn edit-btn">Save</button>
          <button class="btn delete-btn">
            <img src="./remove.svg" class="delete-icon">
          </button>
        </li>
      </ul>
      <h3 class="todo-title">Completed</h3>
      <ul id="done-list">
        <li class="task-item">
          <input type="checkbox" class="task-checkbox" checked>
          <label class="task task-label">See the Doctor</label>
          <input type="text" class="input-text task">
          <button class="btn edit-btn">Edit</button>
          <button class="btn delete-btn">
            <img src="./remove.svg" class="delete-icon">
          </button>
         </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
