<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet" 
      type="text/css"
    >
    <link 
      rel="stylesheet" 
      href="style.css" 
      media="screen" 
      charset="utf-8"
    >
  </head>
  <body class="page">
    <header class="header">
      <img class="header__image" src="./eisenhower-matrix.jpg" alt="Matrix diagram">
      <a 
        class="header__more-info" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
        title="More info about Matrix method"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <section class="add-task">
        <label for="new-task" class="add-task__label">Add Item</label>
        <div class="add-task__actions">
          <input id="new-task"class="add-task__input-text" type="text">
          <button class="add-task__btn" aria-label="Add new task">Add</button>
        </div>
      </section>
      <h3 class="todo-title">Todo</h3>
      <ul id="task-list">
        <li class="task">
          <input type="checkbox" class="task-checkbox">
          <label class="task__label">Pay Bills</label>
          <input type="text" class="task__input-text">
          <button class="task__edit-btn" aria-label="Edit task">Edit</button>
          <button class="task__delete-btn" aria-label="Delete task">
            <img src="./remove.svg" class="task__delete-icon" alt="Delete task">
          </button>
        </li>
        <li class="task edit-mode">
          <input type="checkbox" class="task-checkbox">
          <label class="task__label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task__input-text">
          <button class="task__edit-btn" aria-label="Save edit">Save</button>
          <button class="task__delete-btn" aria-label="Delete task">
            <img src="./remove.svg" class="task__delete-icon" alt="Delete task">
          </button>
        </li>
      </ul>
      <h3 class="todo-title">Completed</h3>
      <ul id="done-list">
        <li class="task">
          <input type="checkbox" class="task-checkbox" checked>
          <label class="task__label">See the Doctor</label>
          <input type="text" class="task__input-text">
          <button class="task__edit-btn" aria-label="Save edit">Edit</button>
          <button class="task__delete-btn" aria-label="Delete task">
            <img src="./remove.svg" class="task__delete-icon" alt="Delete task">
          </button>
         </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
